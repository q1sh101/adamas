# brave.conf - Brave, minimum allow-list for a browser

APP_ID="com.brave.Browser"

# no crash reports, beacons, metrics upload, link pings or keyring prompt - enforced at launch
APP_ARGS=(--disable-breakpad --disable-domain-reliability --metrics-recording-only --no-pings --password-store=basic)

# network - without it, a browser has nothing to do
ALLOW_SHARE=(network)

# wayland - display. pulseaudio - audio/video playback
ALLOW_SOCKET=(wayland pulseaudio)

# GPU - WebGL, video decode, smooth scrolling
ALLOW_DEVICE=(dri)

# profile data survives between launches (bookmarks, logins, extensions)
PERSIST=(.config/BraveSoftware)

# zypak resolves the profile through XDG_CONFIG_HOME - --sandbox leaves it unset and zypak aborts
SET_ENV=(XDG_CONFIG_HOME="${HOME}/.config")

# chromium picks wayland from the session type - without it, it looks for X11 and exits
ALLOW_ENV=(XDG_SESSION_TYPE DESKTOP_STARTUP_ID XDG_ACTIVATION_TOKEN)

# zypak spawns chromium's sandboxed helpers through portal.Flatpak - unreachable without the bus proxy
NEED_PORTAL=true

# adamas owns this launch route
AUTO_SKIP=false
