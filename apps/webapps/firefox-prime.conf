# prime webapp - Firefox isolated profile (DRM video)

APP_ID="org.mozilla.firefox"
# same APP_ID as firefox.conf: this is UI/profile isolation, not a security boundary
# (shared flatpak home and shared portal permission store)
HOOK_NAME="prime"
# hook directory of the launcher that starts this webapp
HOOK_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/hifox/hooks/webapp"
APP_ARGS=(--no-remote --new-instance -P prime --name prime-web --class prime-web https://www.primevideo.com/)
SET_ENV=(GTK_THEME=Adwaita:dark MOZ_APP_REMOTINGNAME=prime-web)

ALLOW_SHARE=(network)
ALLOW_SOCKET=(wayland pulseaudio)
ALLOW_DEVICE=(dri)
PERSIST=(.mozilla .config/mozilla .cache/mozilla .local/share/mozilla)
ALLOW_ENV=(DESKTOP_STARTUP_ID XDG_ACTIVATION_TOKEN
           XDG_CURRENT_DESKTOP XDG_SESSION_TYPE)

# Inhibit keeps the screen awake during playback
NEED_PORTAL=true

# Widevine lives in the profile, so PERSIST covers it
# adamas owns this launch route
AUTO_SKIP=false

# --- fork only: per-sandbox portal filtering (q1sh101/flatpak, add-dbus-call-option) ---
# the permission store is keyed by APP_ID, so on the fork every profile of this
# app carries the same outer bound and differs only in ALLOW_DBUS_CALL, which is
# filtered inside its own sandbox. see docs/ARCHITECTURE.md#portal-access
