# code.conf - VS Code, offline, one project folder

APP_ID="com.visualstudio.code"

# no telemetry, crash reports or experiments - enforced at launch, not in settings
APP_ARGS=(--disable-telemetry --disable-crash-reporter --disable-experiments)

# network - uncomment to install extensions, then comment back
# ALLOW_SHARE=(network)

# wayland - display
ALLOW_SOCKET=(wayland)

# GPU - smooth rendering
ALLOW_DEVICE=(dri)

# projects only - no home, no host
ALLOW_FILESYSTEM=(~/Desktop/c0d3)

# settings, extensions and shared state survive between launches
PERSIST=(.config/Code .local/share/vscode .vscode-shared)

# extensions resolve through XDG_DATA_HOME - --sandbox leaves it unset
SET_ENV=(XDG_DATA_HOME="${HOME}/.local/share")

# electron picks wayland from the session type - without it, it looks for X11 and exits
ALLOW_ENV=(XDG_SESSION_TYPE)

# zypak spawns electron's sandboxed helpers through portal.Flatpak - unreachable without the bus proxy
NEED_PORTAL=true

# adamas owns this launch route
AUTO_SKIP=false
